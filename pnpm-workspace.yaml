packages:
  - apps/*
  - packages/*
  - database

allowBuilds:
  esbuild: true
  # Its install script only fetches the CUDA build; the CPU build ships in the package.
  onnxruntime-node: false

minimumReleaseAgeExclude:
  - drizzle-orm@0.45.4
  - '@fastify/cors@11.3.1'
  - '@fastify/helmet@13.1.2'
  - '@fastify/rate-limit@11.2.1'
  - vite@8.3.4
