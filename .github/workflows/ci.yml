name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # LFS assets (models, PDFs) are not needed for type checks and tests.
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Type check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: 审核页多入口与记录兼容
        run: node tools/recognition/check-review-template.mjs
      - name: 多入口路径评分
        run: node --test tools/recognition/entrance-metrics.test.mjs
      - name: 整店标注与原审核保留
        run: node --test tools/recognition/whole-store-core.test.mjs tools/recognition/whole-store-source-revision.test.mjs tools/recognition/whole-store-wall-assemblies.test.mjs
      - name: 试点数据交接契约
        run: node --test tools/recognition/pilot-contract.test.mjs
      - name: 可导入空间样例与来源校验
        run: node --test tools/recognition/usable-project.test.mjs
      - name: 原图候选比例与未知项校验
        run: node --test tools/recognition/raw-project.test.mjs
      - name: 云端对照发送范围与几何拦截
        run: node --test tools/recognition/cloud-compare-core.test.mjs tools/recognition/cloud-compare-geometry.test.mjs
      - name: 二维对齐来源与贡献记录
        run: node --test tools/recognition/alignment-core.test.mjs
      - name: 原图精细几何与贡献计分
        run: node --test tools/recognition/fine-geometry.test.mjs tools/recognition/fine-evaluate.test.mjs
      - name: OpenAPI contract is up to date
        run: |
          pnpm api:openapi
          git diff --exit-code -- apps/api/openapi.json apps/web/src/api/schema.d.ts
      - name: Build web
        run: pnpm --filter @store/web build
