name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # LFS assets (models, PDFs) are not needed for type checks and tests.
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Type check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: OpenAPI contract is up to date
        run: |
          pnpm api:openapi
          git diff --exit-code -- apps/api/openapi.json apps/web/src/api/schema.d.ts
      - name: Build web
        run: pnpm --filter @store/web build
