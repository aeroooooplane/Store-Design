<svg xmlns="http://www.w3.org/2000/svg" width="486mm" height="486mm" viewBox="-18 -18 486 486"><title>字母凳平面图</title><desc>图源：SI2.0软装道具.pptx第13页。1个坐标单位=1毫米。按左下角五金凳俯视图绘制450×450，侧边细缝按图比例。没有把立面内框误作俯视轮廓。未标注细节按源图比例复原。此图不含尺寸标注。画布外边留白18mm。</desc><g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="450" height="450" rx="0" stroke-width="2" /><line x1="9" y1="0" x2="9" y2="450" stroke-width="1.2" /><line x1="441" y1="0" x2="441" y2="450" stroke-width="1.2" /></g></svg>