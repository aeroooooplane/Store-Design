<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>空间画布</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      * {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div class="viz-dotted-background space-entry-demo">
      <section id="space-entry-proposal" aria-label="空间录入">
        <header>
          <span data-shop-label></span>
          <button type="button" data-action="redraw" disabled>重新描边</button>
        </header>
        <div class="workspace">
          <div class="surface">
            <svg tabindex="0" aria-label="店铺平面。闭合后双击空间内或空白处居中，双击边校正角度">
              <defs>
                <pattern id="space-entry-grid" width="20" height="20" patternUnits="userSpaceOnUse">
                  <path d="M 20 0 H 0 V 20" fill="none" class="grid-mark"></path>
                </pattern>
              </defs>
              <rect
                width="100%"
                height="100%"
                fill="url(#space-entry-grid)"
                data-canvas-background
                aria-hidden="true"
              ></rect>
              <g class="edge-hits"></g>
              <g class="marks"></g>
              <g class="column-placement" pointer-events="none"></g>
            </svg>
            <label class="gap-editor" data-gap-editor hidden>
              <span data-gap-label></span>
              <input type="number" step="1" data-gap-input title="负数表示柱边超出铺位边线" />
            </label>
            <div class="strip">
              <span data-status aria-live="polite"></span>
              <div class="button-row history-actions">
                <button
                  type="button"
                  data-action="undo"
                  title="Ctrl+Z"
                  aria-keyshortcuts="Control+Z Meta+Z"
                  disabled
                >
                  撤回
                </button>
                <button
                  type="button"
                  data-action="redo"
                  title="Ctrl+Y 或 Ctrl+Shift+Z"
                  aria-keyshortcuts="Control+Y Control+Shift+Z Meta+Shift+Z"
                  disabled
                >
                  重做
                </button>
              </div>
            </div>
          </div>
          <aside aria-label="属性面板">
            <div class="inspector-scroll" tabindex="0" aria-label="属性设置">
              <div data-outline>
                <div class="button-row" data-trace-tools hidden>
                  <button type="button" data-action="ortho" aria-pressed="false">正交</button>
                  <small>按住 Shift 临时开启</small>
                </div>
                <div class="measurements">
                  <label
                    >层高
                    <input
                      type="number"
                      min="1500"
                      max="20000"
                      step="any"
                      value="3200"
                      data-setting="height"
                  /></label>
                  <small>单位 mm</small>
                </div>
                <div class="button-row" data-node-actions hidden>
                  <span data-node-label></span>
                  <button
                    type="button"
                    data-action="remove-vertex"
                    title="Delete"
                    aria-keyshortcuts="Delete"
                  >
                    删除节点
                  </button>
                  <small data-node-limit hidden>至少保留 3 个节点</small>
                </div>
                <div class="edge-fields" data-edges>
                  <label
                    >选中边
                    <select data-edge aria-label="选中边"></select
                  ></label>
                  <label
                    >边长（mm）<input type="number" min="100" max="30000" step="1" data-edge-length
                  /></label>
                  <small data-edge-anchor></small>
                  <div class="button-row">
                    <button type="button" data-action="split-edge" aria-pressed="false">
                      添加节点
                    </button>
                    <small data-edge-note>拖动每步 50 mm · 双击校正角度</small>
                  </div>
                  <div class="opening-fields">
                    <span>开放方式</span>
                    <div class="button-row" role="group" aria-label="开放方式">
                      <button type="button" data-opening-mode="wall" aria-pressed="false">
                        封闭
                      </button>
                      <button type="button" data-opening-mode="full" aria-pressed="true">
                        整边开放
                      </button>
                      <button type="button" data-opening-mode="partial" aria-pressed="false" hidden>
                        局部开放
                      </button>
                    </div>
                    <small data-opening-hint hidden>拖动绿色端点，沿边调整开口</small>
                    <div class="measurements" data-partial hidden>
                      <label
                        >距起点（mm）<input
                          type="number"
                          min="0"
                          step="1"
                          data-opening-value="start"
                      /></label>
                      <label
                        >开口宽度（mm）<input
                          type="number"
                          min="1"
                          step="1"
                          data-opening-value="width"
                      /></label>
                    </div>
                    <div class="button-row">
                      <button type="button" data-action="opening" aria-pressed="false">
                        设为主入口
                      </button>
                    </div>
                  </div>
                </div>
                <div class="column-fields" data-columns hidden>
                  <span>柱子</span>
                  <small>靠近墙面自动吸附，按住 Alt 自由摆放</small>
                  <div class="button-row" role="group" aria-label="柱子">
                    <button type="button" data-column-kind="square" aria-pressed="false">
                      放方柱
                    </button>
                    <button type="button" data-column-kind="circle" aria-pressed="false">
                      放圆柱
                    </button>
                  </div>
                  <div class="measurements" data-column-size hidden>
                    <label
                      ><span data-column-width-label>宽（mm）</span
                      ><input type="number" min="50" step="1" data-column-value="width"
                    /></label>
                    <label data-column-depth
                      >深（mm）<input type="number" min="50" step="1" data-column-value="depth"
                    /></label>
                    <label data-column-rotation hidden
                      >角度（°）<input type="number" step="0.1" data-column-angle
                    /></label>
                  </div>
                  <button
                    type="button"
                    data-action="remove-column"
                    title="Delete"
                    aria-keyshortcuts="Delete"
                    hidden
                  >
                    删除选中柱
                  </button>
                </div>
              </div>
            </div>
            <div class="inspector-footer">
              <button class="primary" type="button" data-action="next">确认轮廓</button>
            </div>
          </aside>
        </div>
      </section>
    </div>

    <style>
      .space-entry-demo {
        box-sizing: border-box;
        height: 100vh;
        height: 100dvh;
        padding: 12px;
        max-width: 1120px;
        margin: 0 auto;
      }
      #space-entry-proposal {
        color-scheme: light dark;
        --entry-status-height: 50px;
        --entry-surface: light-dark(#fffefa, #242725);
        --entry-field: light-dark(#fff, #292d2a);
        --entry-canvas: light-dark(#f5f6f0, #1d211f);
        --entry-ink: light-dark(#252a27, #f0f2ec);
        --entry-muted: light-dark(#56615a, #bbc5be);
        --entry-line: light-dark(#d6ddd4, #48544c);
        --entry-accent: light-dark(#f3d354, #f2d35d);
        --entry-accent-ink: #25240f;
        --entry-plan: light-dark(#f0f5ef, #303d35);
        --entry-wall: light-dark(#3c5248, #bdcec3);
        --entry-entry: light-dark(#0c6d52, #72d3ad);
        --entry-error: light-dark(#a12825, #ffada8);
        color: var(--entry-ink);
        background: var(--entry-surface);
        border: 1px solid var(--entry-line);
        border-radius: 13px;
        height: 100%;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        font:
          14px system-ui,
          'Microsoft YaHei',
          sans-serif;
      }
      #space-entry-proposal [hidden] {
        display: none !important;
      }
      #space-entry-proposal header {
        flex: none;
        padding: 12px 16px;
        border-bottom: 1px solid var(--entry-line);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      #space-entry-proposal header strong {
        font-size: 16px;
        font-weight: 600;
      }
      #space-entry-proposal .button-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
      }
      #space-entry-proposal button,
      #space-entry-proposal input,
      #space-entry-proposal select {
        font: inherit;
        color: inherit;
        margin: 0;
        border-radius: 7px;
        border: 1px solid var(--entry-line);
        background: var(--entry-field);
      }
      #space-entry-proposal button {
        min-height: 32px;
        padding: 4px 8px;
        white-space: nowrap;
      }
      #space-entry-proposal button[aria-pressed='true'],
      #space-entry-proposal .primary {
        color: var(--entry-accent-ink);
        background: var(--entry-accent);
        border-color: var(--entry-accent);
      }
      #space-entry-proposal button:disabled {
        opacity: 0.52;
      }
      #space-entry-proposal .workspace {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(220px, 27%);
        grid-template-rows: minmax(0, 1fr);
      }
      #space-entry-proposal .surface {
        position: relative;
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: minmax(0, 1fr) var(--entry-status-height);
      }
      #space-entry-proposal .history-actions {
        flex-wrap: nowrap;
      }
      #space-entry-proposal svg:focus-visible {
        outline: 2px solid var(--entry-entry);
        outline-offset: -2px;
      }
      #space-entry-proposal .gap-editor {
        position: absolute;
        z-index: 1;
        width: min(130px, 90%);
        padding: 6px;
        box-sizing: border-box;
        border-radius: 7px;
        border: 1px solid var(--entry-entry);
        background: var(--entry-surface);
        box-shadow: 0 2px 8px #0002;
        font-size: 12px;
      }
      #space-entry-proposal .plan-dimension text[data-column-gap] {
        pointer-events: bounding-box;
        cursor: text;
      }
      #space-entry-proposal .plan-dimension text[data-column-gap]:is(:hover, :focus-visible) {
        text-decoration: underline;
        font-weight: 700;
      }
      #space-entry-proposal svg {
        width: 100%;
        height: 100%;
        min-height: 0;
        display: block;
        background: var(--entry-canvas);
        touch-action: none;
        user-select: none;
      }
      #space-entry-proposal .grid-mark {
        stroke: var(--entry-line);
        stroke-width: 0.7;
      }
      #space-entry-proposal .strip {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 6px 12px;
        min-height: 0;
        box-sizing: border-box;
        color: var(--entry-muted);
        border-top: 1px solid var(--entry-line);
      }
      #space-entry-proposal [data-status] {
        min-width: 0;
        max-height: 100%;
        overflow: auto;
        overflow-wrap: anywhere;
      }
      #space-entry-proposal [data-status][data-error='true'] {
        color: var(--entry-error);
      }
      #space-entry-proposal aside {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        border-left: 1px solid var(--entry-line);
      }
      #space-entry-proposal .inspector-scroll {
        min-height: 0;
        overflow: hidden auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
        padding: 13px;
      }
      #space-entry-proposal .inspector-scroll:focus-visible {
        outline: 2px solid var(--entry-entry);
        outline-offset: -2px;
      }
      #space-entry-proposal .inspector-scroll > div,
      #space-entry-proposal .edge-fields {
        display: grid;
        gap: 10px;
      }
      #space-entry-proposal .inspector-footer {
        display: flex;
        padding: 8px 13px;
        border-top: 1px solid var(--entry-line);
      }
      #space-entry-proposal .inspector-footer button {
        width: 100%;
      }
      #space-entry-proposal .opening-fields,
      #space-entry-proposal .column-fields {
        display: grid;
        gap: 6px;
      }
      #space-entry-proposal .column-fields {
        border-top: 1px solid var(--entry-line);
        padding-top: 8px;
      }
      #space-entry-proposal [data-action='remove-column'] {
        justify-self: start;
      }
      #space-entry-proposal .measurements {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
        align-items: end;
      }
      #space-entry-proposal label {
        display: grid;
        min-width: 0;
        gap: 3px;
      }
      #space-entry-proposal input,
      #space-entry-proposal select {
        min-height: 32px;
        width: 100%;
        box-sizing: border-box;
        padding: 4px 5px;
      }
      #space-entry-proposal small {
        color: var(--entry-muted);
        font-size: 12px;
      }
      #space-entry-proposal .shape-mark {
        fill: var(--entry-plan);
        pointer-events: none;
      }
      #space-entry-proposal .open-mark {
        fill: none;
        stroke: var(--entry-wall);
        stroke-width: 2;
        pointer-events: none;
      }
      #space-entry-proposal .trace-preview {
        stroke: var(--entry-entry);
        stroke-width: 2;
        stroke-dasharray: 5 4;
        pointer-events: none;
      }
      #space-entry-proposal svg[data-placing-column='true'] {
        cursor: crosshair;
      }
      #space-entry-proposal svg[data-column-preview='true'] {
        cursor: none;
      }
      #space-entry-proposal .column-preview {
        fill: var(--entry-entry);
        fill-opacity: 0.22;
        stroke: var(--entry-entry);
        stroke-width: 1.5;
      }
      #space-entry-proposal .column-wall-snap {
        stroke: var(--entry-accent);
        stroke-width: 5;
        stroke-linecap: round;
        pointer-events: none;
      }
      #space-entry-proposal .column-preview.invalid {
        fill: var(--entry-error);
        stroke: var(--entry-error);
      }
      #space-entry-proposal .plan-dimension {
        pointer-events: none;
        color: var(--entry-muted);
        font-size: 11px;
      }
      #space-entry-proposal .plan-dimension line {
        stroke: currentColor;
        stroke-width: 0.8;
      }
      #space-entry-proposal .plan-dimension .dimension-extension {
        opacity: 0.6;
      }
      #space-entry-proposal .plan-dimension .dimension-leader {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.8;
      }
      #space-entry-proposal .plan-dimension text {
        fill: currentColor;
        stroke: var(--entry-canvas);
        stroke-width: 3px;
        stroke-linejoin: round;
        paint-order: stroke fill;
      }
      #space-entry-proposal .plan-dimension[data-dimension='overall'] {
        color: var(--entry-ink);
        font-weight: 600;
      }
      #space-entry-proposal .plan-dimension[data-dimension='column'] {
        color: var(--entry-entry);
      }
      #space-entry-proposal .plan-dimension[data-dimension='column'] text {
        stroke: var(--entry-plan);
      }
      #space-entry-proposal svg[data-placing-column='true'] .edge-mark,
      #space-entry-proposal svg[data-placing-column='true'] .vertex-hit {
        pointer-events: none;
      }
      #space-entry-proposal .edge-mark {
        stroke: transparent;
        stroke-width: 20;
        cursor: grab;
      }
      #space-entry-proposal svg[data-adding-node='true'] .edge-mark {
        cursor: crosshair;
      }
      #space-entry-proposal svg[data-adding-node='true'] .vertex-hit {
        pointer-events: none;
      }
      #space-entry-proposal svg[data-edge-dragging='true'],
      #space-entry-proposal svg[data-edge-dragging='true'] .edge-mark {
        cursor: grabbing;
      }
      #space-entry-proposal .chosen-edge {
        stroke: var(--entry-accent);
        stroke-width: 10;
        opacity: 0.7;
        pointer-events: none;
      }
      #space-entry-proposal .wall-mark {
        stroke: var(--entry-wall);
        stroke-width: 2;
        pointer-events: none;
      }
      #space-entry-proposal .opening-mark {
        stroke: var(--entry-entry);
        stroke-width: 5;
        stroke-dasharray: 9 4;
        pointer-events: none;
      }
      #space-entry-proposal .open-edge-mark {
        stroke: var(--entry-entry);
        stroke-width: 3;
        stroke-dasharray: 8 4;
        pointer-events: none;
      }
      #space-entry-proposal .opening-end {
        fill: var(--entry-field);
        stroke: var(--entry-entry);
        stroke-width: 1.5;
        pointer-events: none;
      }
      #space-entry-proposal .opening-handle {
        fill: transparent;
        cursor: grab;
      }
      #space-entry-proposal .opening-handle-tether {
        stroke: var(--entry-entry);
        stroke-width: 1;
        pointer-events: none;
      }
      #space-entry-proposal .opening-end.active {
        stroke-width: 2.5;
      }
      #space-entry-proposal .fixed-obstacle {
        fill: var(--entry-wall);
        opacity: 0.55;
        pointer-events: none;
      }
      #space-entry-proposal .column-mark {
        fill: var(--entry-wall);
        stroke: var(--entry-field);
        stroke-width: 1.5;
      }
      #space-entry-proposal .column-mark.selected {
        stroke: var(--entry-accent);
        stroke-width: 3;
      }
      #space-entry-proposal .column-mark[data-column] {
        cursor: grab;
      }
      #space-entry-proposal .column-rotate-stem {
        stroke: var(--entry-accent);
        stroke-width: 1.5;
        pointer-events: none;
      }
      #space-entry-proposal .column-rotate {
        fill: var(--entry-field);
        stroke: var(--entry-accent);
        stroke-width: 1.5;
        cursor: grab;
      }
      #space-entry-proposal .column-rotate-label {
        fill: var(--entry-wall);
        font-size: 15px;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
      }
      #space-entry-proposal svg[data-object-dragging='true'],
      #space-entry-proposal
        svg[data-object-dragging='true']
        :is(.opening-handle, .column-mark, .column-rotate) {
        cursor: grabbing;
      }
      #space-entry-proposal .vertex-mark {
        fill: var(--entry-field);
        stroke: var(--entry-wall);
        stroke-width: 1.7;
        pointer-events: none;
      }
      #space-entry-proposal .vertex-mark.selected {
        fill: var(--entry-accent);
        stroke-width: 2;
      }
      #space-entry-proposal .vertex-hit {
        fill: transparent;
      }
      #space-entry-proposal .vertex-hit {
        cursor: grab;
      }
      #space-entry-proposal .vertex-hit:active {
        cursor: grabbing;
      }
      #space-entry-proposal .decor-label {
        fill: var(--entry-muted);
        font-size: 12px;
        pointer-events: none;
      }
      @media (max-width: 560px) {
        .space-entry-demo {
          padding: 6px;
        }
        #space-entry-proposal {
          --entry-status-height: 58px;
        }
        #space-entry-proposal header {
          padding: 8px 10px;
        }
        #space-entry-proposal .workspace {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: minmax(0, 3fr) minmax(0, 2fr);
        }
        #space-entry-proposal aside {
          border-left: 0;
          border-top: 1px solid var(--entry-line);
        }
      }
      @media (pointer: coarse) {
        #space-entry-proposal {
          --entry-status-height: 62px;
        }
        #space-entry-proposal button,
        #space-entry-proposal input,
        #space-entry-proposal select {
          min-height: 44px;
        }
      }
    </style>

    <script>
      ;(() => {
        const root = document.getElementById('space-entry-proposal')
        const svg = root.querySelector('svg')
        const marks = root.querySelector('.marks')
        const edgeHits = root.querySelector('.edge-hits')
        const columnPlacement = root.querySelector('.column-placement')
        const status = root.querySelector('[data-status]')
        const controls = (name) => root.querySelector('[data-action="' + name + '"]')
        const setting = (name) => root.querySelector('[data-setting="' + name + '"]')
        const edgeSelect = root.querySelector('[data-edge]')
        const memory = []
        const redo = []
        const EDGE_STEP = 50
        const COLUMN_SNAP_MM = 100
        const MAX_VERTICES = 200
        const MAX_OBSTACLES = 100
        const openingLabels = { wall: '封闭', full: '整边开放', partial: '局部开放' }
        const copy = (value) => structuredClone(value)
        const initial = {
          shop: 'island',
          height: 3200,
          points: [],
          closed: false,
          columns: [],
          ortho: false,
          ...shopDefaults('island', []),
        }
        let state = copy(initial)
        let session = null
        let submitLabel = '确认轮廓并进入方案'
        let fixedObstacles = []
        let submitting = false
        let drag = null
        let justDragged = false
        let addingNode = false
        let placingColumn = null
        let columnCursor = null
        let selectedColumn = -1
        let selectedVertex = -1
        let gapEdit = null
        let objectClipboard = null
        let shiftHeld = false
        let traceCursor = null
        let error = ''
        let projection
        const edgeLength = root.querySelector('[data-edge-length]')
        const edgeNote = root.querySelector('[data-edge-note]')
        const edgeAnchorNote = root.querySelector('[data-edge-anchor]')
        const offsetField = root.querySelector('[data-opening-value="start"]')
        const widthField = root.querySelector('[data-opening-value="width"]')
        const columnSize = root.querySelector('[data-column-size]')
        const columnFields = [...columnSize.querySelectorAll('[data-column-value]')]
        const columnAngle = columnSize.querySelector('[data-column-angle]')
        const gapEditor = root.querySelector('[data-gap-editor]')
        const gapInput = root.querySelector('[data-gap-input]')
        const gapDirections = [
          ['左', 0, -1],
          ['右', 0, 1],
          ['上', 1, -1],
          ['下', 1, 1],
        ]

        function shopDefaults(shop, points) {
          const front = points.reduce((best, a, i) => {
            const b = points[(i + 1) % points.length]
            const far = points[best],
              next = points[(best + 1) % points.length]
            return a[1] + b[1] > far[1] + next[1] ||
              (a[1] + b[1] === far[1] + next[1] && length(a, b) > length(far, next))
              ? i
              : best
          }, 0)
          return {
            edge: front,
            mainEdge: shop !== 'island' && points.length ? front : -1,
            openings: points.map((_, i) =>
              shop === 'island' || i === front ? { mode: 'full' } : null,
            ),
          }
        }

        function snapshot() {
          return { state: copy(state), column: selectedColumn, vertex: selectedVertex }

          finish()
        }
        columnAngle.addEventListener('change', saveColumnRotation)
        columnAngle.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            event.preventDefault()
            saveColumnRotation()
          }
        })
        function saveOpeningValue(field) {
          const opening = state.openings[state.edge],
            value = field.valueAsNumber
          if (opening?.mode !== 'partial') return
          if (!field.checkValidity() || !Number.isFinite(value)) {
            error = '开口位置和宽度需在选中边内'
            render()
            return
          }
          const key = field.dataset.openingValue
          if (opening[key] === value) return
          const size = length(
            state.points[state.edge],
            state.points[(state.edge + 1) % state.points.length],
          )
          remember()
          error = ''
          state.openings[state.edge] = fitOpening({ ...opening, [key]: value }, size)
          finish()
        }
        ;[offsetField, widthField].forEach((field) => {
          field.addEventListener('change', () => saveOpeningValue(field))
          field.addEventListener('blur', () => saveOpeningValue(field))
          field.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') saveOpeningValue(field)
          })
        })
        function saveEdgeLength() {
          const size = edgeLength.valueAsNumber
          if (!state.closed || !edgeLength.checkValidity() || !Number.isFinite(size)) {
            render()
            return
          }
          const end = (state.edge + 1) % state.points.length
          const a = state.points[state.edge],
            b = state.points[end]
          if (size === Math.round(length(a, b))) return
          const { useStart } = edgeLengthAnchor(a, b)
          const [anchor, moving, movingIndex] = useStart ? [a, b, end] : [b, a, state.edge]
          const resized = moveAlong(anchor, unit(subtract(moving, anchor)), size)
          const points = state.points.map((p, i) => (i === movingIndex ? resized : p))
          if (
            !isSimple(points) ||
            Math.sign(signedArea(points)) !== Math.sign(signedArea(state.points))
          ) {
            error = '该尺寸会使轮廓交叉或产生过短的边'
            render()
            return
          }
          const openings = openingsFromFixedEnds(state, points)
          if (!openingsFit(points, openings)) {
            error = '该尺寸会挤到局部开口'
            render()
            return
          }
          remember()
          error = ''
          updateOutline(points, openings)
          finish()
        }
        edgeLength.addEventListener('change', saveEdgeLength)
        edgeLength.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            event.preventDefault()
            saveEdgeLength()
          }
        })
        setting('height').addEventListener('change', (event) => {
          const field = event.target,
            value = field.valueAsNumber
          if (!field.checkValidity() || !Number.isFinite(value)) {
            render()
            return
          }
          if (state.height === value) return
          remember()
          state.height = value
          error = ''
          finish()
        })
        svg.addEventListener('click', (event) => {
          if (justDragged) {
            justDragged = false
            return
          }
          if (event.target.hasAttribute('data-column-gap')) {
            openGapEditor(event.target)
            return
          }
          error = ''
          if (addingNode) {
            insertEdgeNode(event)
            return
          }
          if (!state.closed) {
            const enabled = state.ortho || event.shiftKey
            const vertex = event.target.getAttribute('data-vertex')
            if (vertex === '0') {
              closeShape(enabled)
              return
            }
            if (vertex !== null) {
              selectVertex(Number(vertex))
              return
            }
            if (state.points.length >= MAX_VERTICES) {
              error = '轮廓最多可包含 200 个节点'
              render()
              return
            }
            const point = tracePoint(fromScreen(event), enabled)
            if (state.points.some((existing) => length(existing, point) < 100)) return
            remember()
            state.points.push(point)
            selectedVertex = -1
            finish()
            return
          }
          if (placingColumn) {
            const { column } = positionColumn({ point: fromScreen(event, 1), free: event.altKey })
            if (!columnFits(column)) {
              error = '请选择未被占用的位置'
              render()
              return
            }
            remember()
            state.columns.push(column)
            selectedColumn = state.columns.length - 1
            placingColumn = null
            includeEditedColumn(column)
            finish()
            return
          }
        })
        svg.addEventListener('dblclick', (event) => {
          if (drag || addingNode || placingColumn || !state.closed) return
          const edge = event.target.getAttribute('data-mark-edge')
          if (edge === null) {
            if (event.target === svg || event.target.hasAttribute('data-canvas-background')) {
              projection = measure(true)
              paint()
            }
            return
          }
          const correction = correctedEdge(state.points, Number(edge))
          const { points } = correction
          let reason = correction.reason
          if (points && !reason && !openingsFit(points, state.openings))
            reason = '校正后的边长容不下已有的局部开口'
          if (reason) {
            error = '无法校正，' + reason
            render()
            return
          }
          if (!points) return
          remember()
          error = ''
          updateOutline(points)
          finish()
        })
        svg.addEventListener('pointerdown', (event) => {
          if (event.button !== 0 || drag) return
          justDragged = false
          if (addingNode || placingColumn || event.target.hasAttribute('data-column-gap')) return
          const vertex = event.target.getAttribute('data-vertex')
          const edge = event.target.getAttribute('data-mark-edge')
          const openingEnd = event.target.getAttribute('data-opening-end')
          const column = event.target.getAttribute('data-column')
          const rotate = event.target.getAttribute('data-column-rotate')
          if ([edge, vertex, openingEnd, column, rotate].every((value) => value === null)) {
            if (selectedColumn >= 0 || (state.closed && selectedVertex >= 0)) {
              selectedColumn = -1
              selectedVertex = -1
              render()
            }
            return
          }
          const base = {
            before: copy(state),
            column: selectedColumn,
            vertex: selectedVertex,
            moved: false,
            pointer: event.pointerId,
          }
          if (openingEnd !== null) {
            const index = state.edge
            const a = state.points[index],
              b = state.points[(index + 1) % state.points.length]
            const size = length(a, b)
            drag = {
              ...base,
              key: 'opening',
              index,
              openingEnd,
              start: fromScreen(event, 0),
              direction: subtract(b, a).map((v) => v / size),
              size: Math.floor(size + 0.00001),
            }
            svg.setPointerCapture(event.pointerId)
            return
          }
          if (rotate !== null) {
            const index = Number(rotate)
            const center = [state.columns[index].x, state.columns[index].y]
            const [x, y] = subtract(fromScreen(event, 0), center)
            drag = { ...base, key: 'column-rotation', index, center, start: Math.atan2(y, x) }
            error = ''
            svg.focus({ preventScroll: true })
            svg.setPointerCapture(event.pointerId)
            return
          }
          if (column !== null) {
            const index = Number(column)
            drag = { ...base, key: 'column', index, start: fromScreen(event, 0) }
            selectedColumn = index
            selectedVertex = -1
            error = ''
            svg.focus({ preventScroll: true })
            svg.setPointerCapture(event.pointerId)
            render()
            return
          }
          if (state.closed && edge !== null) {
            const index = Number(edge)
            const a = state.points[index],
              b = state.points[(index + 1) % state.points.length]
            const direction = unit(subtract(b, a))
            drag = {
              ...base,
              key: 'edge',
              index,
              start: fromScreen(event, 0),
              direction,
              normal: [-direction[1], direction[0]],
              axis: null,
              offset: 0,
            }
            state.edge = index
            selectedColumn = -1
            selectedVertex = -1
            error = ''
            event.target.setPointerCapture(event.pointerId)
            render()
            return
          }
          if (vertex !== null && state.closed) {
            const index = Number(vertex)
            drag = { ...base, key: 'vertex', index }
            svg.setPointerCapture(event.pointerId)
            selectVertex(index)
            return
          }
        })
        function previewColumnAt(event) {
          if (!placingColumn || event.pointerType === 'touch') return
          columnCursor = { point: fromScreen(event, 1), free: event.altKey }
          paintColumnPlacement()
        }
        function updateDraggedColumn(point, free) {
          const original = drag.before.columns[drag.index]
          const [dx, dy] = subtract(point, drag.start).map(
            (value) => Math.round(value / EDGE_STEP) * EDGE_STEP,
          )
          const raw = { ...original, x: original.x + dx, y: original.y + dy }
          const { column, wall } = snapColumnToWall(raw, free || (!dx && !dy), drag.index)
          if (!inCanvas(toScreen([column.x, column.y])) || !columnFits(column, drag.index)) return
          drag.wall = wall
          state.columns[drag.index] = column
          drag.moved = original.x !== column.x || original.y !== column.y
          paint()
        }
        function setColumnSnapBypass(free) {
          if (placingColumn && columnCursor && columnCursor.free !== free) {
            columnCursor.free = free
            paintColumnPlacement()
          }
          if (drag?.key === 'column' && drag.point) updateDraggedColumn(drag.point, free)
        }
        for (const type of ['keydown', 'keyup']) {
          window.addEventListener(type, (event) => {
            if (event.key === 'Alt') setColumnSnapBypass(event.altKey)
          })
        }
        window.addEventListener('blur', () => setColumnSnapBypass(false))

        svg.addEventListener('pointerenter', previewColumnAt)
        svg.addEventListener('pointermove', (event) => {
          if (placingColumn) {
            previewColumnAt(event)
            return
          }
          if (!drag) {
            if (!state.closed && state.points.length) {
              shiftHeld = event.shiftKey
              controls('ortho').setAttribute('aria-pressed', String(orthoActive()))
              traceCursor = fromScreen(event)
              paint()
            }
            return
          }
          if (event.pointerId !== drag.pointer) return
          if (drag.key === 'opening') {
            const along = dot(subtract(fromScreen(event, 0), drag.start), drag.direction)
            const offset = Math.round(along / EDGE_STEP) * EDGE_STEP
            const opening = drag.before.openings[drag.index],
              end = opening.start + opening.width
            let start = opening.start,
              nextEnd = end
            if (drag.openingEnd === 'start') {
              start = Math.max(end === drag.size ? 1 : 0, Math.min(end - 1, start + offset))
            } else {
              nextEnd = Math.max(
                start + 1,
                Math.min(drag.size - (start === 0 ? 1 : 0), end + offset),
              )
            }
            const width = nextEnd - start,
              current = state.openings[drag.index]
            if (start === current.start && width === current.width) return
            state.openings[drag.index] = { ...opening, start, width }
            drag.moved = start !== opening.start || width !== opening.width
            error = ''
            render()
            return
          }
          if (drag.key === 'column-rotation') {
            const offset = subtract(fromScreen(event, 0), drag.center)
            if (vectorLength(offset) * projection.scale < 4) return
            const [x, y] = offset
            const original = drag.before.columns[drag.index]
            const angle =
              (original.rotation ?? 0) + ((Math.atan2(y, x) - drag.start) * 180) / Math.PI
            const next = rotatedColumn(original, angle)
            if (!columnFits(next, drag.index)) {
              error = '旋转后会与其他柱子重叠'
            } else {
              drag.moved = (next.rotation ?? 0) !== columnRotation(original.rotation ?? 0)
              state.columns[drag.index] = drag.moved ? next : original
              error = ''
            }
            render()
            return
          }
          if (drag.key === 'column') {
            drag.point = fromScreen(event, 0)
            updateDraggedColumn(drag.point, event.altKey)
            return
          }
          if (drag.key === 'edge') {
            const delta = subtract(fromScreen(event, 0), drag.start)
            const along = dot(delta, drag.direction),
              across = dot(delta, drag.normal)
            const axis = drag.axis ?? (Math.abs(along) > Math.abs(across) ? 'along' : 'across')
            const offset = Math.round((axis === 'along' ? along : across) / EDGE_STEP) * EDGE_STEP
            if (offset === drag.offset) {
              if (error) {
                error = ''
                render()
              }
              return
            }
            drag.axis = axis
            const original = drag.before
            const candidate =
              axis === 'along'
                ? slideEdge(original, drag.index, drag.direction, offset)
                : parallelEdge(original, drag.index, drag.normal, offset)
            const { points } = candidate
            if (
              candidate.edge < 0 ||
              points.length > Math.max(MAX_VERTICES, original.points.length) ||
              !isSimple(points) ||
              Math.sign(signedArea(points)) !== Math.sign(signedArea(original.points))
            ) {
              error = '该位置会让边线交叉、边线过短或尺寸超出范围'
              render()
              return
            }
            if (axis === 'along' && !openingsFit(points, candidate.openings)) {
              error = '该位置会挤到局部开口'
              render()
              return
            }
            svg.setPointerCapture(event.pointerId)
            state.edge = candidate.edge
            state.mainEdge = candidate.mainEdge
            updateOutline(points, candidate.openings)
            drag.offset = offset
            drag.moved = offset !== 0
            error = ''
            render()
            return
          }
          const point = fromScreen(event)
          const points = state.points.map((p, i) => (i === drag.index ? point : p))
          if (!isSimple(points) || length(state.points[drag.index], point) < 50) return
          updateOutline(points, drag.before.openings)
          if (!drag.moved) {
            svg.setPointerCapture(event.pointerId)
            drag.moved = true
          }
          paint()
        })
        svg.addEventListener('pointerleave', () => {
          if (columnCursor) {
            columnCursor = null
            paintColumnPlacement()
          }
          if (traceCursor) {
            traceCursor = null
            paint()
          }
        })
        svg.addEventListener('pointerup', (event) => {
          if (!drag || event.pointerId !== drag.pointer) return
          const previous = drag
          drag = null
          if (!previous.moved) {
            render()
            return
          }
          justDragged = previous.key !== 'edge'
          if (previous.key === 'column' || previous.key === 'column-rotation')
            includeEditedColumn(state.columns[previous.index])
          error = ''
          remember({ state: previous.before, column: previous.column, vertex: previous.vertex })
          finish()
        })
        svg.addEventListener('pointercancel', (event) => {
          if (!drag || event.pointerId !== drag.pointer) return
          state = drag.before
          selectedColumn = drag.column
          selectedVertex = drag.vertex
          drag = null
          error = ''
          render()
        })
        // Only the enclosing editor can initialize the isolated editing surface.
        window.addEventListener('message', (event) => {
          if (
            session ||
            event.source !== window.parent ||
            event.data?.type !== 'store-space-capture' ||
            !event.ports[0]
          )
            return
          const incoming = event.data.state
          if (!Array.isArray(incoming?.points) || !Array.isArray(incoming.openings)) return
          session = event.ports[0]
          session.onmessage = ({ data }) => {
            if (data?.type !== 'submission-finished') return
            submitting = false
            error = typeof data.error === 'string' ? data.error : ''
            render()
          }
          state = incoming
          if (typeof event.data.submitLabel === 'string') submitLabel = event.data.submitLabel
          fixedObstacles = event.data.fixedObstacles
          projection = undefined
          render()
        })
        new ResizeObserver(paint).observe(svg)
        render()
      })()
    </script>
  </body>
</html>
