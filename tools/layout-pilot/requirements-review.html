<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>24家 · 空间与道具审核</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f2;color:#171717;font:14px system-ui}header{background:#171717;color:white;padding:15px 20px;display:flex;gap:16px;align-items:center}header strong{color:#ffd200;font-size:22px}button,select,input,textarea{font:inherit;border:1px solid #aaa;border-radius:4px;padding:7px;background:white;color:#111}button{cursor:pointer}button.primary,nav button.active{background:#ffd200;border-color:#ffd200}button:disabled{opacity:.45;cursor:default}.layout{display:grid;grid-template-columns:190px minmax(0,1fr) 310px;gap:12px;padding:12px}nav,main,aside{background:white;border:1px solid #ddd;padding:12px;border-radius:6px}nav button{width:100%;text-align:left;margin:3px 0}h2{font-size:20px;margin:5px 0 14px}h3{font-size:15px}p{line-height:1.6}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row label{white-space:nowrap}svg{width:100%;height:67vh;border:1px solid #ccc;background:#fff;touch-action:none}label{display:block;margin:7px 0}textarea{width:100%;height:62px}table{border-collapse:collapse;width:100%;font-size:12px}td,th{border-bottom:1px solid #ddd;padding:5px;text-align:left}small,.muted{color:#666}#status{margin-left:auto;color:#ffd200}a{color:#111}details{margin:12px 0}pre{white-space:pre-wrap;max-height:220px;overflow:auto}.warn{padding:8px;border-left:4px solid #ffd200;background:#fff8ce}#timerText{font-variant-numeric:tabular-nums}@media(max-width:1100px){.layout{grid-template-columns:160px 1fr}aside{grid-column:1/-1}}
</style>
<header><strong>空间与道具审核</strong><span>24家 · 原审核保留</span><button id="export" class="primary">导出审核包</button><button id="import">导入审核包</button><input hidden type="file" id="file" accept=".json"><span id="status"></span></header>
<div class="layout"><nav id="stores"></nav><main><h2 id="title"></h2>
<div class="row"><select id="mode" aria-label="查看方案"><option value="space">轮廓与墙体</option value="source">原有道具</option value="before">上一版自动</option><option value="area">本轮自动 · 方案A</option><option value="max">本轮自动 · 方案B</option><option value="min">本轮自动 · 方案C</option></select><label><input id="boundaryVisible" type="checkbox" checked>轮廓</label><label><input id="wallsVisible" type="checkbox" checked>墙柱</label><label><input id="backgroundVisible" type="checkbox" checked>底图</label><button id="undo">撤销 Ctrl+Z</button></div>
<p id="summary"></p><svg id="drawing" role="img" aria-label="门店轮廓墙体道具叠图"></svg>
<p>黄虚线：使用范围　深灰：已有墙柱　黄填色：补标墙体/禁放区　白点：可拖顶点</p>
<div class="row"><select id="target" aria-label="修改对象"></select><button id="addWall">描一段漏墙</button><button id="finishWall">完成描墙</button><button id="cancelWall">取消描墙</button><button id="reset">撤回本店修改</button></div>
<p id="editHint" class="muted">先选轮廓或补标墙体，再拖动顶点。修改后需重新排布。</p><p id="details"></p><a id="download" download>下载本轮工作台项目（审核草稿）</a>
<details><summary>原审核与补标依据</summary><pre id="trace"></pre></details></main>
<aside><label>审核人<input id="reviewer" aria-label="审核人"></label><div class="row"><button id="timer">开始计时</button><span id="timerText">未计时</span></div><p class="muted">仅计本页前台活动；30秒无操作暂停累计。请导出保存计时。</p>
<div id="questions"></div><label>本店补充<textarea id="note" aria-label="本店补充"></textarea></label><button id="confirm" class="primary">保存并看下一家</button>
<h3>原图配置（件）</h3><div id="counts"></div><details open><summary>本轮缺项</summary><div id="shortages"></div></details><details><summary>使用限制</summary><div id="limits"></div></details></aside></div>
<script>
const DATA=/*__DATA__*/;
const $=id=>document.getElementById(id), key=DATA.id+':'+DATA.fingerprint;
let state;try{state=JSON.parse(localStorage.getItem(key))}catch{}
state=state||{fingerprint:DATA.fingerprint,reviewer:localStorage.getItem('layout-reviewer')||'',answers:{},notes:{},confirmed:{},revisions:{},timings:{}};
state.revisions??={};state.timings??={};const history=[];let index=0,drag=null,draft=[],drawing=false,timing=false,lastTick=performance.now(),lastActivity=performance.now();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const current=()=>DATA.rows[index];
function save(){localStorage.setItem(key,JSON.stringify(state));localStorage.setItem('layout-reviewer',state.reviewer);$('status').textContent='已存本机'}
function snapshot(){history.push(JSON.stringify(state));if(history.length>80)history.shift()}
function change(fn){snapshot();fn();save()}
function tick(){const now=performance.now();if(timing&&!document.hidden&&now-lastActivity<30000){const id=current().id;state.timings[id]??={activeSeconds:0,edits:0,kind:'page-active-review',sessions:[]};state.timings[id].activeSeconds+=(now-lastTick)/1000}lastTick=now;$('timerText').textContent=state.timings[current().id]?Math.round(state.timings[current().id].activeSeconds)+' 秒':'未计时'}
function stopTimer(){tick();timing=false;$('timer').textContent='开始计时';save()}
setInterval(tick,1000);['pointerdown','keydown','wheel'].forEach(type=>document.addEventListener(type,()=>lastActivity=performance.now(),{passive:true}));document.addEventListener('visibilitychange',()=>{if(document.hidden)stopTimer()});
function geometry(){const r=current();return state.revisions[r.id]||{boundary:structuredClone(r.space.boundary),walls:r.audit.additions.map(o=>({id:o.id,polygon:structuredClone(o.polygon),label:o.label}))}}
function edited(g){state.revisions[current().id]=g;delete state.confirmed[current().id];if(state.timings[current().id])state.timings[current().id].edits++;save()}
function undo(){if(history.length){const times=state.timings;state=JSON.parse(history.pop());state.timings=times;save();render()}}
function switchStore(i){stopTimer();index=i;draft=[];drawing=false;render()}
function render(){const r=current();$('title').textContent=r.id+' · '+r.name;$('reviewer').value=state.reviewer;$('note').value=state.notes[r.id]||'';$('stores').innerHTML=DATA.rows.map((r,i)=>`<button data-i="${i}" class="${i===index?'active':''}">${esc(r.name)}${state.confirmed[r.id]?' ✓':''}</button>`).join('');$('stores').querySelectorAll('button').forEach(b=>b.onclick=()=>switchStore(+b.dataset.i));
 $('summary').textContent=`原轮廓 ${r.space.boundary.length} 点 · 补标范围 ${r.audit.additions.length} 处 · 原注道具 ${r.demand.physicalCount} 件`;
 $('questions').innerHTML=r.questions.map(q=>`<label>${esc(q.question)}<textarea data-q="${esc(q.id)}" aria-label="${esc(q.id)}">${esc(state.answers[q.id]||'')}</textarea></label>`).join('');$('questions').querySelectorAll('textarea').forEach(t=>t.onchange=()=>change(()=>state.answers[t.dataset.q]=t.value));
 $('counts').innerHTML='<table><tr><th>实体</th><th>数量</th></tr>'+r.demand.entities.map(e=>`<tr><td>${esc(e.label)}</td><td>1</td></tr>`).join('')+'</table><p class="muted">组合台只计一件；附带凳子不重复计数。</p>';
 const c=r.candidates.find(c=>c.strategy==='area');$('shortages').innerHTML=c.shortages.length?c.shortages.map(s=>`<p>${esc(s.label)}：${esc(s.reason)}</p>`).join(''):'<p>原注数量已放齐，仍需检查动线与适用性。</p>';
 const placeholder=c.layout.items.filter(x=>x.placeholder).length;if(placeholder)$('shortages').innerHTML+=`<p class="warn">${placeholder}件为标注尺寸占位，尚无对应模型。</p>`;
 $('limits').innerHTML=DATA.limitations.map(s=>'<p>'+esc(s)+'</p>').join('');$('trace').textContent=JSON.stringify({priorReview:r.priorReview,note:r.audit.note,wallCompleteness:r.audit.wallCompleteness,sourceAnnotationHash:r.sourceFileHash,oldGeometryRecheck:r.previousRecheck.map(c=>({strategy:c.strategy,errors:c.issues.filter(i=>i.severity==='error').length}))},null,2);
 const oldTarget=$('target').value,g=geometry();$('target').innerHTML='<option value="">只查看</option><option value="boundary">修改使用轮廓</option>'+g.walls.map(w=>`<option value="${esc(w.id)}">${esc(w.label)}</option>`).join('');if([...$('target').options].some(o=>o.value===oldTarget))$('target').value=oldTarget;
 $('download').href=r.projectFile;$('download').hidden=!!state.revisions[r.id];$('editHint').textContent=state.revisions[r.id]?'本店已修改：请导出修订包，重新排布前旧候选不作为通过依据。':'先选对象，再拖白点；黄填色为本轮补标草稿。';tick();draw();}
function draw(){const r=current(),g=geometry(),mode=$('mode').value,svg=$('drawing'),scale=1000/r.mmPerPixel,px=p=>p.map((v,k)=>v*scale+r.originPx[k]),pts=ps=>ps.map(px).map(p=>p.join(',')).join(' ');
 const all=[...g.boundary,...g.walls.flatMap(w=>w.polygon)].map(px),minX=Math.max(0,Math.min(...all.map(p=>p[0]))-70),minY=Math.max(0,Math.min(...all.map(p=>p[1]))-70),w=Math.max(...all.map(p=>p[0]))-minX+70,h=Math.max(...all.map(p=>p[1]))-minY+70;svg.setAttribute('viewBox',`${minX} ${minY} ${w} ${h}`);
 let html=$('backgroundVisible').checked?`<image href="images/${r.id}.png" width="${r.image.width}" height="${r.image.height}" opacity="${mode==='space'||mode==='source'?1:.3}"/>`:'';
 if($('wallsVisible').checked){for(const o of r.space.obstacles.filter(o=>!o.label?.startsWith('补标')))html+=`<polygon data-layer="existing-wall" points="${pts(o.polygon)}" fill="#5555" stroke="#333" stroke-width="1"><title>${esc(o.label)}</title></polygon>`;for(const o of g.walls)html+=`<polygon data-layer="new-wall" points="${pts(o.polygon)}" fill="#ffd20077" stroke="#8c6500" stroke-width="2"><title>${esc(o.label)}</title></polygon>`;}
 if(mode==='source')for(const o of r.objects.filter(o=>!['column','partition','cladding','existing-wall'].includes(o.category)))html+=`<polygon points="${pts(o.polygon)}" fill="none" stroke="#9a7000" stroke-width="2"><title>${esc(o.label)}</title></polygon>`;
 const c=mode==='before'?r.previousCandidates.find(c=>c.strategy==='area'):r.candidates.find(c=>c.strategy===mode);
 if(c)for(const o of c.layout.items){const rad=(o.rotation-Math.round(o.rotation/90)*90)*Math.PI/180,ps=[[-o.w/2,-o.d/2],[o.w/2,-o.d/2],[o.w/2,o.d/2],[-o.w/2,o.d/2]].map(([x,z])=>[o.cx+x*Math.cos(rad)-z*Math.sin(rad),o.cz+x*Math.sin(rad)+z*Math.cos(rad)]);html+=`<polygon data-layer="furniture" points="${pts(ps)}" fill="#fff9" stroke="#111" stroke-width="3"><title>${esc(o.name)}${o.placeholder?'（尺寸占位）':''}</title></polygon>`;}
 if($('boundaryVisible').checked)html+=`<polygon data-layer="boundary-halo" points="${pts(g.boundary)}" fill="none" stroke="#111" stroke-width="8"/><polygon data-layer="boundary" points="${pts(g.boundary)}" fill="none" stroke="#ffd200" stroke-width="5" stroke-dasharray="14 8"/>`;
 const target=$('target').value,poly=target==='boundary'?g.boundary:g.walls.find(x=>x.id===target)?.polygon;if(poly&&mode==='space')poly.forEach((p,i)=>{const [x,y]=px(p);html+=`<circle data-vertex="${i}" cx="${x}" cy="${y}" r="7" fill="white" stroke="#111" stroke-width="2"/>`});if(draft.length)html+=`<polyline points="${pts(draft)}" fill="none" stroke="#111" stroke-width="4"/>`;svg.innerHTML=html;
 $('details').textContent=c?`自动 ${c.layout.items.length} 件；${c.shortages?.length??'—'} 项缺配。${c.layout.planning?.note||''}`:r.audit.note;
}
function pointer(e){const p=$('drawing').createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform($('drawing').getScreenCTM().inverse()),r=current();return[(q.x-r.originPx[0])*r.mmPerPixel/1000,(q.y-r.originPx[1])*r.mmPerPixel/1000]}
$('drawing').onpointerdown=e=>{if($('mode').value!=='space')return;if(drawing){draft.push(pointer(e));draw();return}if(e.target.dataset.vertex!==undefined){snapshot();drag={vertex:+e.target.dataset.vertex,target:$('target').value,g:structuredClone(geometry())};$('drawing').setPointerCapture(e.pointerId)}};
$('drawing').onpointermove=e=>{if(!drag)return;const ps=drag.target==='boundary'?drag.g.boundary:drag.g.walls.find(w=>w.id===drag.target).polygon;ps[drag.vertex]=pointer(e);state.revisions[current().id]=drag.g;draw()};
$('drawing').onpointerup=()=>{if(drag){edited(drag.g);drag=null;render()}};
$('addWall').onclick=()=>{drawing=true;draft=[];$('mode').value='space';$('editHint').textContent='依次点击墙体外边角，至少3点后点“完成描墙”。';draw()};
$('finishWall').onclick=()=>{if(draft.length<3)return;const g=structuredClone(geometry());change(()=>{g.walls.push({id:current().id+'-USER-'+Date.now(),label:'用户补墙',polygon:structuredClone(draft)});edited(g)});drawing=false;draft=[];render()};$('cancelWall').onclick=()=>{drawing=false;draft=[];draw()};
$('reset').onclick=()=>{change(()=>{delete state.revisions[current().id];delete state.confirmed[current().id]});render()};
['mode','target','boundaryVisible','wallsVisible','backgroundVisible'].forEach(id=>$(id).onchange=draw);$('undo').onclick=undo;document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!['INPUT','TEXTAREA'].includes(e.target.tagName)){e.preventDefault();undo()}});
$('timer').onclick=()=>{if(timing){stopTimer();return}timing=true;lastTick=lastActivity=performance.now();const id=current().id;state.timings[id]??={activeSeconds:0,edits:0,kind:'page-active-review',sessions:[]};state.timings[id].sessions.push({startedAt:new Date().toISOString()});$('timer').textContent='暂停计时';save()};
$('reviewer').onchange=()=>change(()=>state.reviewer=$('reviewer').value);$('note').onchange=()=>change(()=>state.notes[current().id]=$('note').value);
$('confirm').onclick=()=>{change(()=>state.confirmed[current().id]=new Date().toISOString());switchStore(Math.min(index+1,DATA.rows.length-1))};
$('export').onclick=()=>{stopTimer();const blob=new Blob([JSON.stringify({...state,dataset:DATA.id,businessApproved:false,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='24家空间与道具审核包.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const v=JSON.parse(await $('file').files[0].text());if(v.fingerprint!==DATA.fingerprint||!v.answers||!v.notes||!v.confirmed||typeof v.reviewer!=='string')throw Error('不是本批审核包，原记录未改动');stopTimer();change(()=>state={...v,revisions:v.revisions||{},timings:v.timings||{}});render()}catch(e){$('status').textContent=e.message}};
window.addEventListener('beforeunload',()=>{tick();save()});render();
</script></html>
