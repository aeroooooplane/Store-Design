<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>布局试点 · 24家审核</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f2;color:#171717;font:15px system-ui}header{background:#151515;color:#fff;padding:18px 24px;display:flex;align-items:center;gap:18px}header strong{color:#ffd200;font-size:22px}button,select,input,textarea{font:inherit;border:1px solid #aaa;border-radius:5px;padding:8px;background:white;color:#111}button,a{cursor:pointer}button.primary{background:#ffd200;border-color:#ffd200;font-weight:bold}.layout{display:grid;grid-template-columns:235px 1fr 340px;gap:14px;padding:16px}nav,aside,main{background:#fff;border:1px solid #ddd;border-radius:8px;padding:14px}nav button{width:100%;text-align:left;margin:4px 0}nav button.active{background:#ffd200}main{min-width:0}svg{width:100%;height:65vh;background:#fff;border:1px solid #ddd}textarea{width:100%;min-height:65px}label{display:block;margin:10px 0}h2{font-size:20px}h3{font-size:16px}small,.muted{color:#666}p{line-height:1.6}.row{display:flex;gap:8px;flex-wrap:wrap}.badge{background:#eee;padding:5px 9px;border-radius:4px}.warning{color:#9a4600}details{margin:12px 0}a{color:#161616;text-decoration:underline}#status{color:#ffd200;margin-left:auto} @media(max-width:1050px){.layout{grid-template-columns:180px 1fr}aside{grid-column:1/-1}}
</style><header><strong>布局试点</strong><span>保留原标注 · 检查自动方案</span><button id="export" class="primary">导出答复</button><button id="import">导入答复</button><input type="file" id="file" accept=".json" hidden><span id="status"></span></header>
<div class="layout"><nav id="stores"></nav><main><h2 id="title"></h2><div class="row"><select id="mode" aria-label="显示图层"><option value="source">原图与已审核标注</option><option value="max">自动 · 多放</option><option value="area">自动 · 按面积</option><option value="min">自动 · 少放</option></select><button id="undo">撤销答复 Ctrl+Z</button><a id="download" download>下载工作台项目</a></div><p id="summary"></p><svg id="drawing" role="img" aria-label="布局叠图"></svg><p id="details" class="muted"></p><details><summary>转换记录与限制</summary><pre id="trace" style="white-space:pre-wrap;max-height:280px;overflow:auto"></pre></details></main><aside><label>审核人<input id="reviewer" aria-label="审核人"></label><div id="questions"></div><label>本店补充<textarea id="note" aria-label="本店补充"></textarea></label><button id="confirm" class="primary">保存并看下一家</button><p class="muted">答复保存在本机。完成后请导出；原审核和原坐标保持不变。</p><details><summary>本轮范围</summary><div id="limits"></div></details></aside></div>
<script>
const DATA=/*__DATA__*/;
const $=id=>document.getElementById(id),key=DATA.id+':'+DATA.fingerprint;let state;try{state=JSON.parse(localStorage.getItem(key))}catch{}state=state||{fingerprint:DATA.fingerprint,reviewer:localStorage.getItem('layout-reviewer')||'',answers:{},notes:{},confirmed:{}};const history=[];let index=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(key,JSON.stringify(state));localStorage.setItem('layout-reviewer',state.reviewer);$('status').textContent='已保存在本机'}
function change(fn){history.push(JSON.stringify(state));fn();save()}
function undo(){if(history.length){state=JSON.parse(history.pop());save();render()}}
function render(){const r=DATA.rows[index];$('title').textContent=r.id+' · '+r.name;$('reviewer').value=state.reviewer;$('note').value=state.notes[r.id]||'';
 $('stores').innerHTML=DATA.rows.map((r,i)=>`<button class="${i===index?'active':''}" data-i="${i}">${esc(r.name)}${state.confirmed[r.id]?' ✓':''}</button>`).join('');$('stores').querySelectorAll('button').forEach(b=>b.onclick=()=>{index=+b.dataset.i;render()});
 $('download').hidden=!r.projectFile;$('download').href=r.projectFile||'#';$('summary').textContent=r.blocked?'空间转换待处理：'+(r.failure||r.spaceIssues?.map(i=>i.message).join('；')||'缺少可用开放边'):`${r.objects.length}项原标注保留；${r.generatedValid||0}/3组候选通过当前几何校验；${r.questions.length}项本店待确认。`;
 const qs=[...DATA.questions,...r.questions];$('questions').innerHTML=qs.map(q=>`<label>${esc(q.question)}<textarea data-q="${esc(q.id)}" aria-label="${esc(q.id)}">${esc(state.answers[q.id]||'')}</textarea></label>`).join('');$('questions').querySelectorAll('textarea').forEach(t=>t.onchange=()=>change(()=>state.answers[t.dataset.q]=t.value));
 $('limits').innerHTML=DATA.limitations.map(v=>'<p>'+esc(v)+'</p>').join('');$('trace').textContent=JSON.stringify({assumptions:r.assumptions,trace:r.trace,referenceOnly:r.omitted,referenceIssues:r.referenceIssues,spaceIssues:r.spaceIssues},null,2);draw();}
function draw(){const r=DATA.rows[index],svg=$('drawing'),mode=$('mode').value,scale=1000/r.mmPerPixel,px=p=>[p[0]*scale+r.originPx[0],p[1]*scale+r.originPx[1]],pts=ps=>ps.map(px).map(p=>p.join(',')).join(' ');svg.setAttribute('viewBox',`0 0 ${r.image.width} ${r.image.height}`);let html=`<image href="images/${r.id}.png" width="${r.image.width}" height="${r.image.height}" opacity="${mode==='source'?1:.3}"/>`;if(!r.space){svg.innerHTML=html;return}
 html+=`<polygon points="${pts(r.space.boundary)}" fill="none" stroke="#111" stroke-width="5"/>`;
 if(mode==='source'){for(const o of r.objects)html+=`<polygon points="${pts(o.polygon)}" fill="#ffd20022" stroke="#ad7800" stroke-width="3"><title>${esc(o.label)}</title></polygon>`;$('details').textContent='黄色：原审核标注。原对象全部保留，未用自动候选覆盖。'}
 else{for(const o of r.space.obstacles)html+=`<polygon points="${pts(o.polygon)}" fill="#5558" stroke="#333" stroke-width="1"/>`;const c=r.candidates.find(c=>c.strategy===mode);if(c){for(const o of c.layout.items){const angle=o.rotation-Math.round(o.rotation/90)*90,rad=angle*Math.PI/180,ps=[[-o.w/2,-o.d/2],[o.w/2,-o.d/2],[o.w/2,o.d/2],[-o.w/2,o.d/2]].map(([x,z])=>[o.cx+x*Math.cos(rad)-z*Math.sin(rad),o.cz+x*Math.sin(rad)+z*Math.cos(rad)]);html+=`<polygon points="${pts(ps)}" fill="#ffd200bb" stroke="#111" stroke-width="3"><title>${esc(o.name)}</title></polygon>`} $('details').textContent=`自动放置${c.layout.items.length}件；${c.issues.length}项检查提示。`+c.notes.join('；')+' '+(c.layout.planning?.relaxations||[]).map(x=>`${x.rule}：${x.target}→${x.actual}`).join('；')}else $('details').textContent=r.generationFailure||'本店尚无该候选。'}svg.innerHTML=html;}
 $('mode').onchange=draw;$('undo').onclick=undo;document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!['INPUT','TEXTAREA'].includes(e.target.tagName)){e.preventDefault();undo()}});
 $('reviewer').onchange=()=>change(()=>state.reviewer=$('reviewer').value);$('note').onchange=()=>change(()=>state.notes[DATA.rows[index].id]=$('note').value);$('confirm').onclick=()=>{change(()=>state.confirmed[DATA.rows[index].id]=new Date().toISOString());index=Math.min(index+1,DATA.rows.length-1);render()};
 $('export').onclick=()=>{const b=new Blob([JSON.stringify({...state,dataset:DATA.id,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='24家布局试点答复.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const v=JSON.parse(await $('file').files[0].text());if(v.fingerprint!==DATA.fingerprint||!v.answers||!v.notes||!v.confirmed||typeof v.reviewer!=='string')throw Error('不是本批审核答复');change(()=>state=v);render()}catch(e){$('status').textContent=e.message}};render();
</script></html>
