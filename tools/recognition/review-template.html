<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>门店图纸 · 轮廓与入口审核</title>
  <style>
    :root {
      font:
        15px/1.5 system-ui,
        'Microsoft YaHei',
        sans-serif;
      color: #222;
      background: #f4f5f7;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
    }
    body:has(#editor:not([hidden])) {
      overflow: hidden;
    }
    header {
      padding: 22px 30px;
      background: #171717;
      color: white;
      position: sticky;
      top: 0;
      z-index: 3;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 8px;
    }
    button,
    input,
    select,
    textarea {
      font: inherit;
    }
    button {
      border: 1px solid #ccc;
      border-radius: 7px;
      background: white;
      padding: 8px 12px;
      cursor: pointer;
    }
    button.primary {
      background: #ffd200;
      border-color: #ffd200;
      font-weight: 650;
    }
    button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    header button {
      margin: 6px 4px 0 0;
    }
    #summary {
      color: #ddd;
    }
    main {
      padding: 24px 30px;
    }
    .notice {
      background: #fff4cf;
      border-left: 4px solid #d69c00;
      padding: 14px;
      margin-bottom: 20px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      border: 1px solid #ddd;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }
    .card img {
      width: 100%;
      height: 210px;
      object-fit: contain;
      background: white;
    }
    .card .info {
      padding: 12px;
    }
    .card h2 {
      font-size: 16px;
      margin: 0 0 7px;
    }
    .tag {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      background: #e8edf3;
      font-size: 12px;
      margin: 3px;
    }
    .status {
      background: #fff1c2;
    }
    .done {
      background: #d8efdf;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    #editor[hidden] {
      display: none;
    }
    #editor {
      position: fixed;
      inset: 0;
      background: #f4f5f7;
      z-index: 5;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      grid-template-rows: 54px 1fr;
    }
    .editor-head {
      grid-column: 1/-1;
      background: #202020;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 18px;
    }
    .drawing {
      overflow: auto;
      padding: 12px;
      background: #dce0e5;
    }
    #stage {
      position: relative;
      width: 1200px;
      max-width: none;
      background: white;
      line-height: 0;
    }
    #page {
      width: 100%;
      height: auto;
      display: block;
    }
    #ink {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }
    aside {
      overflow: auto;
      padding: 18px;
      background: white;
      border-left: 1px solid #ddd;
    }
    aside label {
      display: block;
      margin: 12px 0 4px;
      font-weight: 600;
    }
    aside input,
    aside select,
    aside textarea {
      width: 100%;
      padding: 7px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    aside button {
      margin: 5px 2px 2px 0;
    }
    small {
      color: #666;
      display: block;
    }
    .modes {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .modes button[aria-pressed='true'] {
      background: #111;
      color: white;
    }
    .error {
      color: #a71e1e;
      white-space: pre-wrap;
    }
    #preview {
      white-space: pre-wrap;
      background: #f4f5f7;
      padding: 10px;
      font-size: 13px;
    }
    .progress {
      font-weight: 600;
    }
    .foot {
      margin-top: 24px;
      color: #666;
    }
    dialog {
      max-width: 620px;
      border: 0;
      border-radius: 12px;
      padding: 24px;
    }
    @media (max-width: 850px) {
      #editor {
        grid-template-columns: 1fr;
        grid-template-rows: 54px 55vh 1fr;
      }
      aside {
        border-left: 0;
      }
      main {
        padding: 16px;
      }
    }
    aside {
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
      min-height: 0;
    }
    .editor-fields {
      overflow: auto;
      padding: 18px;
      min-height: 0;
      flex: 1;
    }
    .editor-actions {
      flex-shrink: 0;
      padding: 10px 16px;
      border-top: 1px solid #ddd;
      background: white;
    }
    .editor-actions small {
      font-size: 12px;
    }
  </style>
  <header>
    <h1>轮廓与入口审核</h1>
    <div id="summary"></div>
    <button id="export-all" class="primary">导出审核包</button
    ><button id="import-button">导入审核包</button
    ><input id="import-file" type="file" accept="application/json" hidden /><span
      id="save-state"
    ></span>
  </header>
  <main>
    <div class="notice">
      <strong>本轮：轮廓、量尺、入口。</strong> 家具与柱位将在整店标注中补充。
      <details>
        <summary>审核范围</summary>
        支持多入口、多侧开放和曲折入口。已确认仅代表本轮标注，不代表家具、型号或整店验收。记录保存在本机，请导出备份。
      </details>
    </div>
    <div class="toolbar">
      <select id="filter">
        <option value="all">全部门店</option>
        <option value="pending">待审核</option>
        <option value="reviewed">已确认</option>
        <option value="ambiguous">待讨论</option></select
      ><input id="search" placeholder="搜索编号或门店" /><span
        id="progress"
        class="progress"
      ></span>
    </div>
    <div class="cards" id="cards"></div>
    <p class="foot">记录保存在本机，可导出备份或换电脑导入继续。</p>
  </main>
  <section id="editor" hidden>
    <div class="editor-head">
      <span id="heading"></span>
      <div>
        <button id="zoom-out">缩小</button><button id="zoom-in">放大</button
        ><button id="close">返回清单</button>
      </div>
    </div>
    <div class="drawing">
      <div id="stage"><img id="page" alt="门店原始主平面图" /><svg id="ink"></svg></div>
    </div>
    <aside>
      <div class="editor-fields">
        <details>
          <summary>查看原图依据</summary>
          <small id="evidence" style="white-space: pre-wrap"></small>
        </details>
        <div class="modes">
          <button data-mode="view" aria-pressed="true">查看</button
          ><button data-mode="boundary" aria-pressed="false">描轮廓</button
          ><button data-mode="calibration" aria-pressed="false">量尺两点</button
          ><button data-mode="entrance" aria-pressed="false">入口 / 开放侧</button>
        </div>
        <small id="mode-help">查看模式，点击图纸不会改动标注。</small>
        <div id="entrance-tools" hidden>
          <label for="entrance-list">当前入口</label
          ><select id="entrance-list"></select>
          <label for="entrance-kind">新增入口形状</label
          ><select id="entrance-kind">
            <option value="polyline">直线 / 折线</option>
            <option value="arc">三点圆弧</option>
          </select>
          <button id="new-entrance">新增入口</button
          ><button id="delete-entrance">删除当前入口</button>
        </div>
        <button id="undo" title="Ctrl+Z">撤销</button
        ><button id="redo" title="Ctrl+Y / Ctrl+Shift+Z">重做</button
        ><button id="clear">清空当前绘制</button> <label for="length">已知长度（毫米）</label
        ><input id="length" type="number" min="1" placeholder="按图中尺寸，如 4760" />
        <label for="geometry">轮廓形态</label
        ><select id="geometry">
          <option value="">请选择</option>
          <option>直墙</option>
          <option>斜墙</option>
          <option>弧形</option>
          <option>多种形态</option>
        </select>
        <label
          ><input id="open-edge" type="checkbox" style="width: auto" /> 有开放边／中岛边界</label
        >
        <label for="page-type">图纸类型</label
        ><select id="page-type">
          <option value="">请选择</option>
          <option value="vector-text">矢量，有文字层</option>
          <option value="vector-outline">矢量，文字转曲／无有效文字层</option>
          <option value="raster">图片／扫描件</option>
          <option value="wrong-page">选页不正确</option>
        </select>
        <label for="reviewer">审核人（自动记住）</label
        ><input id="reviewer" placeholder="首次填写即可" /> <label for="notes">备注</label
        ><textarea
          id="notes"
          rows="3"
          placeholder="如柱位应扣除、入口不确定、尺寸需确认"
        ></textarea>
        <div id="preview"></div>
        <div id="error" class="error" role="alert"></div>
      </div>
      <div class="editor-actions">
        <button id="approve" class="primary">确认并返回</button
        ><button id="ambiguous">待讨论</button><button id="draft">保存并返回</button
        ><button id="cancel">取消本次修改</button
        ><small>修改后需重新确认；撤销可恢复原状态。</small>
      </div>
    </aside>
  </section>
  <script>
    'use strict'
    const dataset = /*DATASET*/ null
    const $ = (s) => document.querySelector(s)
    const legacyKey =
      'recognition-review:' +
      dataset.id +
      (dataset.reviewVersion ? ':' + dataset.reviewVersion : '')
    const key = legacyKey + ':v2'
    const byId = new Map(dataset.samples.map((s) => [s.id, s]))
    const clone = (x) => JSON.parse(JSON.stringify(x))
    const distance = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1])
    const esc = (s) =>
      String(s ?? '').replace(
        /[&<>"']/g,
        (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
      )
    const fresh = () => ({
      boundary: [],
      calibration: [],
      entrances: [],
      entranceReviewVersion: 2,
      lengthMm: 0,
      geometry: '',
      openEdge: false,
      pageType: '',
      reviewer: '',
      notes: '',
      status: 'pending',
      origin: 'manual',
      agentStatus: 'unreviewed',
      evidence: [],
    })
    let records = {},
      current = null,
      mode = 'view',
      zoom = 1200,
      activeEntrance = 0,
      openingRecord = null
    const histories = new Map()
    let reviewerDefault = ''
    function pointList(points, s) {
      if (
        !Array.isArray(points) ||
        points.length > 2000 ||
        points.some(
          (p) =>
            !Array.isArray(p) ||
            p.length !== 2 ||
            p.some((v) => !Number.isFinite(v)) ||
            p[0] < 0 ||
            p[1] < 0 ||
            p[0] > s.image.width ||
            p[1] > s.image.height,
        )
      )
        throw Error('坐标无效')
      return clone(points)
    }
    function safeRecord(a, s) {
      if (!s?.image) throw Error('门店图像无效')
      const r = fresh()
      for (const k of ['boundary', 'calibration']) r[k] = pointList(a[k], s)
      const paths =
        a.entrances ?? (a.entrance?.length ? [{ kind: 'polyline', points: a.entrance }] : [])
      if (!Array.isArray(paths) || paths.length > 100) throw Error('入口数量无效')
      r.entrances = paths.map((e) => {
        if (!e || !['polyline', 'arc'].includes(e.kind)) throw Error('入口类型无效')
        return { kind: e.kind, points: pointList(e.points, s) }
      })
      r.entranceReviewVersion =
        a.entranceReviewVersion === 2
          ? 2
          : a.entranceReviewVersion === 1 || a.entrances === undefined
            ? 1
            : 2
      for (const k of ['geometry', 'pageType', 'reviewer', 'notes']) {
        if (typeof a[k] !== 'string') throw Error('文本字段无效')
        r[k] = a[k]
      }
      r.lengthMm = Number.isFinite(a.lengthMm) ? a.lengthMm : 0
      r.openEdge = a.openEdge === true
      r.status = ['pending', 'ambiguous', 'reviewed'].includes(a.status) ? a.status : 'pending'
      if (typeof a.reviewedAt === 'string') r.reviewedAt = a.reviewedAt
      r.origin = ['manual', 'recognizer', 'visual-correction'].includes(a.origin)
        ? a.origin
        : 'manual'
      r.agentStatus = ['unreviewed', 'checked', 'needs_decision'].includes(a.agentStatus)
        ? a.agentStatus
        : 'unreviewed'
      if (
        a.evidence !== undefined &&
        (!Array.isArray(a.evidence) || a.evidence.some((v) => typeof v !== 'string'))
      )
        throw Error('证据字段无效')
      r.evidence = clone(a.evidence ?? [])
      if (r.origin === 'recognizer' && r.status === 'reviewed') r.status = 'pending'
      return r
    }
    function scaleOf(r) {
      return r.calibration.length === 2 &&
        distance(...r.calibration) > 5 &&
        Number.isFinite(r.lengthMm) &&
        r.lengthMm > 0
        ? r.lengthMm / distance(...r.calibration)
        : null
    }
    const cross = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0])
    function pointDistance(p, a, b) {
      const l = (b[0] - a[0]) ** 2 + (b[1] - a[1]) ** 2
      const t = l
        ? Math.max(
            0,
            Math.min(1, ((p[0] - a[0]) * (b[0] - a[0]) + (p[1] - a[1]) * (b[1] - a[1])) / l),
          )
        : 0
      return distance(p, [a[0] + t * (b[0] - a[0]), a[1] + t * (b[1] - a[1])])
    }
    // 三点圆弧：起点、弧上点、终点。保留控制点，采样仅用于显示和沿边界校验。
    function entrancePoints(e) {
      if (e.kind !== 'arc' || e.points.length !== 3) return e.points
      const [a, b, c] = e.points,
        d = 2 * cross(a, b, c)
      if (Math.abs(d) < 0.01) return []
      const aa = a[0] ** 2 + a[1] ** 2,
        bb = b[0] ** 2 + b[1] ** 2,
        cc = c[0] ** 2 + c[1] ** 2
      const o = [
        (aa * (b[1] - c[1]) + bb * (c[1] - a[1]) + cc * (a[1] - b[1])) / d,
        (aa * (c[0] - b[0]) + bb * (a[0] - c[0]) + cc * (b[0] - a[0])) / d,
      ]
      const radius = distance(a, o),
        tau = 2 * Math.PI,
        angle = (p) => Math.atan2(p[1] - o[1], p[0] - o[0]),
        positive = (v) => ((v % tau) + tau) % tau
      const start = angle(a),
        end = positive(angle(c) - start),
        mid = positive(angle(b) - start),
        sweep = mid <= end ? end : end - tau
      const n = Math.max(8, Math.ceil((Math.abs(sweep) * radius) / 4))
      if (n > 20000) return []
      return Array.from({ length: n + 1 }, (_, i) => [
        o[0] + radius * Math.cos(start + (sweep * i) / n),
        o[1] + radius * Math.sin(start + (sweep * i) / n),
      ])
    }
    function validate(r, s) {
      if (!s.image) return ['原图不可用']
      try {
        safeRecord(r, s)
      } catch (e) {
        return [e.message]
      }
      const errors = [],
        p = r.boundary
      if (p.length < 3) errors.push('轮廓至少需要 3 点')
      let area = 0
      for (let i = 0; i < p.length; i++) {
        const a = p[i],
          b = p[(i + 1) % p.length]
        area += a[0] * b[1] - b[0] * a[1]
        if (distance(a, b) < 1) errors.push('轮廓存在重复点')
        for (let j = i + 2; j < p.length; j++) {
          if (i === 0 && j === p.length - 1) continue
          const c = p[j],
            d = p[(j + 1) % p.length]
          if (
            (cross(a, b, c) * cross(a, b, d) < 0 && cross(c, d, a) * cross(c, d, b) < 0) ||
            pointDistance(c, a, b) < 0.1 ||
            pointDistance(a, c, d) < 0.1
          )
            errors.push('轮廓自相交或重叠')
        }
      }
      if (Math.abs(area) < 100) errors.push('轮廓面积过小')
      if (!scaleOf(r)) errors.push('请完成量尺并填写毫米数')
      if (!r.entrances.length) errors.push('请标注入口或开放侧，可添加多条')
      for (const [i, e] of r.entrances.entries()) {
        const label = '入口 ' + (i + 1),
          pts = entrancePoints(e)
        if ((e.kind === 'arc' && e.points.length !== 3) || pts.length < 2) {
          errors.push(label + ' 尚未完成（圆弧需要不共线的 3 点）')
          continue
        }
        let length = 0,
          off = false
        for (let j = 1; j < pts.length; j++) {
          const a = pts[j - 1],
            b = pts[j],
            len = distance(a, b)
          length += len
          if (len < 0.01) errors.push(label + ' 存在重复点')
          // 不只检查端点：防止入口连线穿过店内或凹口。
          const n = Math.max(1, Math.ceil(len / 4))
          for (let k = 0; k <= n; k++) {
            const q = [a[0] + ((b[0] - a[0]) * k) / n, a[1] + ((b[1] - a[1]) * k) / n]
            if (
              q[0] < 0 ||
              q[1] < 0 ||
              q[0] > s.image.width ||
              q[1] > s.image.height ||
              !p.some((v, t) => pointDistance(q, v, p[(t + 1) % p.length]) <= 12)
            )
              off = true
          }
        }
        if (length < 5) errors.push(label + ' 长度不足')
        if (off) errors.push(label + ' 应沿轮廓描画，转角处请补点')
      }
      if (!['直墙', '斜墙', '弧形', '多种形态'].includes(r.geometry)) errors.push('请选择轮廓形态')
      if (!['vector-text', 'vector-outline', 'raster'].includes(r.pageType))
        errors.push('请核对图纸类型')
      if (!r.reviewer.trim()) errors.push('首次使用请填写审核人')
      return [...new Set(errors)]
    }
    function decodePack(data) {
      if (
        ![1, 2].includes(data.schemaVersion) ||
        data.datasetId !== dataset.id ||
        data.fingerprint !== dataset.fingerprint ||
        (data.reviewVersion ?? null) !== (dataset.reviewVersion ?? null) ||
        data.acceptanceListSha256 !== dataset.acceptanceListSha256
      )
        throw Error('审核包版本或来源不匹配')
      if (!Array.isArray(data.annotations) || data.annotations.length > dataset.samples.length)
        throw Error('门店清单无效')
      const incoming = {}
      for (const a of data.annotations) {
        const s = byId.get(a.store_id)
        if (
          !s ||
          incoming[s.id] ||
          a.sourceSha256 !== s.sourceSha256 ||
          a.image?.sha256 !== s.image.sha256 ||
          a.page !== s.page
        )
          throw Error('门店重复或原图指纹不匹配')
        const r = safeRecord(a, s)
        if (r.status === 'reviewed' && validate(r, s).length) r.status = 'pending'
        incoming[s.id] = r
      }
      return incoming
    }
    for (const s of dataset.samples)
      if (s.annotationDraft) records[s.id] = safeRecord(s.annotationDraft, s)
    // 构建时显式提供的用户审核包为初始记录；浏览器更新记录优先。
    if (dataset.reviewedPack) records = { ...records, ...decodePack(dataset.reviewedPack) }
    try {
      reviewerDefault = localStorage.getItem('recognition-reviewer') || ''
      const raw = localStorage.getItem(key),
        old = localStorage.getItem(legacyKey)
      // 显式审核包比旧页面缓存更新。只有无审核包时自动迁移旧缓存。
      const payload = raw || (!dataset.reviewedPack ? old : null)
      if (payload) {
        const saved = JSON.parse(payload),
          incoming = {}
        if (saved.datasetId !== dataset.id || saved.fingerprint !== dataset.fingerprint)
          throw Error('缓存版本不符')
        for (const [id, r] of Object.entries(saved.records || {}))
          incoming[id] = safeRecord(r, byId.get(id))
        if (!raw && old && !localStorage.getItem(legacyKey + ':backup-before-v2'))
          localStorage.setItem(legacyKey + ':backup-before-v2', old)
        records = { ...records, ...incoming }
      }
    } catch {
      $('#save-state').textContent = '本机记录读取失败，请导入备份'
    }
    function save() {
      try {
        localStorage.setItem(
          key,
          JSON.stringify({
            schemaVersion: 2,
            datasetId: dataset.id,
            fingerprint: dataset.fingerprint,
            records,
          }),
        )
        $('#save-state').textContent = '已保存'
        return true
      } catch {
        $('#save-state').textContent = '保存失败，请导出备份'
        return false
      }
    }
    function historyFor() {
      if (!histories.has(current)) histories.set(current, { undo: [], redo: [] })
      return histories.get(current)
    }
    function snapshot() {
      return { record: clone(records[current]), activeEntrance }
    }
    function syncFields() {
      const r = records[current]
      for (const [id, k] of [
        ['length', 'lengthMm'],
        ['geometry', 'geometry'],
        ['page-type', 'pageType'],
        ['reviewer', 'reviewer'],
        ['notes', 'notes'],
      ])
        $('#' + id).value = r[k] || ''
      $('#open-edge').checked = r.openEdge
      $('#evidence').textContent = r.evidence.join('\n')
    }
    function change(fn, { invalidate = true } = {}) {
      if (!current) return
      const before = snapshot()
      fn(records[current])
      if (JSON.stringify(before) === JSON.stringify(snapshot())) return
      const h = historyFor()
      h.undo.push(before)
      if (h.undo.length > 100) h.undo.shift()
      h.redo = []
      if (invalidate) {
        records[current].status = 'pending'
        records[current].agentStatus = 'unreviewed'
        delete records[current].reviewedAt
      }
      save()
      draw()
    }
    function restore(direction) {
      if (!current) return
      const h = historyFor(),
        other = direction === 'undo' ? 'redo' : 'undo',
        previous = h[direction].pop()
      if (!previous) return
      h[other].push(snapshot())
      records[current] = previous.record
      activeEntrance = previous.activeEntrance
      syncFields()
      save()
      draw()
    }
    function render() {
      const filter = $('#filter').value,
        q = $('#search').value.toLowerCase()
      const done = dataset.samples.filter((s) => records[s.id]?.status === 'reviewed').length
      $('#summary').textContent = `${dataset.samples.length} 家 · 轮廓、量尺与出入口`
      $('#progress').textContent = `已确认 ${done}/${dataset.samples.length}`
      $('#cards').innerHTML = dataset.samples
        .filter((s) => {
          const st = records[s.id]?.status || 'pending'
          return (
            (filter === 'all' || (filter === 'pending' ? st !== 'reviewed' : st === filter)) &&
            `${s.id} ${s.name}`.toLowerCase().includes(q)
          )
        })
        .map((s) => {
          const st = records[s.id]?.status || 'pending',
            label = st === 'reviewed' ? '已确认' : st === 'ambiguous' ? '待讨论' : '待审核'
          return `<article class="card"><img loading="lazy" src="images/${esc(s.id)}-thumb.webp" alt="${esc(s.name)}"><div class="info"><h2>${esc(s.id)} · ${esc(s.name)}</h2><div>第 ${s.page} 页 · ${esc(s.shopType)}</div><span class="tag ${st === 'reviewed' ? 'done' : 'status'}">${label}</span><button data-open="${esc(s.id)}" ${s.renderError ? 'disabled' : ''}>查看标注</button></div></article>`
        })
        .join('')
    }
    function open(id) {
      if (!byId.has(id)) return
      current = id
      records[id] ??= fresh()
      openingRecord = clone(records[id])
      activeEntrance = 0
      const s = byId.get(id)
      $('#heading').textContent = `${id} · ${s.name} · 第 ${s.page} 页`
      $('#page').src = s.image.path
      $('#ink').setAttribute('viewBox', `0 0 ${s.image.width} ${s.image.height}`)
      $('#ink').setAttribute('preserveAspectRatio', 'none')
      $('#editor').hidden = false
      zoom = Math.min(1200, Math.max(300, $('.drawing').clientWidth - 24))
      syncFields()
      if (!records[id].reviewer) $('#reviewer').value = reviewerDefault
      $('#error').textContent = ''
      setMode('view')
      draw()
    }
    function closeEditor() {
      $('#editor').hidden = true
      current = null
      render()
      // 深链接确认后回到本页清单；不跳转外部来源或关闭用户标签。
      if (typeof history !== 'undefined' && typeof location !== 'undefined') {
        const url = new URL(location.href)
        url.searchParams.delete('store')
        history.replaceState(null, '', url)
      }
    }
    function setMode(m) {
      mode = m
      document
        .querySelectorAll('[data-mode]')
        .forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === m)))
      $('#mode-help').textContent =
        m === 'view'
          ? '查看模式，点击图纸不会改动标注。'
          : m === 'boundary'
            ? '沿轮廓依次点选；修改后可撤销。'
            : m === 'calibration'
              ? '点选尺寸两端，填写毫米数。'
              : '可标多条入口或开放侧；折线连续点选，圆弧点起点、弧上点、终点。'
      $('#entrance-tools').hidden = m !== 'entrance'
      $('#ink').style.cursor = m === 'view' ? 'default' : 'crosshair'
      if (current) draw()
    }
    function draw() {
      const r = records[current]
      if (!r) return
      $('#stage').style.width = zoom + 'px'
      const line = (pts, color, closed = false, labels = true) =>
        `${pts.length > 1 ? `<${closed ? 'polygon' : 'polyline'} points="${pts.map((p) => p.join(',')).join(' ')}" fill="${closed ? '#007aff18' : 'none'}" stroke="${color}" stroke-width="3"/>` : ''}${labels ? pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${color}"/><text x="${p[0] + 9}" y="${p[1] - 8}" font-size="18" fill="${color}">${i + 1}</text>`).join('') : ''}`
      $('#ink').innerHTML =
        line(r.boundary, '#007aff', r.boundary.length >= 3) +
        line(r.calibration, '#bd3b11') +
        r.entrances
          .map((e, i) => {
            const color = i === activeEntrance ? '#128749' : '#8456ac'
            return (
              line(entrancePoints(e), color, false, false) +
              e.points
                .map(
                  (p, j) =>
                    `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${color}"/><text x="${p[0] + 9}" y="${p[1] - 8}" font-size="18" fill="${color}">${i + 1}.${j + 1}</text>`,
                )
                .join('')
            )
          })
          .join('')
      $('#entrance-list').innerHTML = r.entrances
        .map(
          (e, i) =>
            `<option value="${i}">入口 ${i + 1} · ${e.kind === 'arc' ? '圆弧' : '直线/折线'} · ${e.points.length} 点</option>`,
        )
        .join('')
      $('#entrance-list').value = String(activeEntrance)
      const h = historyFor()
      $('#undo').disabled = !h.undo.length
      $('#redo').disabled = !h.redo.length
      $('#clear').disabled = mode === 'view'
      $('#delete-entrance').disabled = !r.entrances[activeEntrance]
      $('#preview').textContent =
        `轮廓 ${r.boundary.length} 点 · 入口 ${r.entrances.length} 条 · ${r.status === 'reviewed' ? '已确认' : r.status === 'ambiguous' ? '待讨论' : '草稿'}`
    }
    $('#ink').addEventListener('click', (e) => {
      if (!current || mode === 'view') return
      const box = e.currentTarget.getBoundingClientRect(),
        s = byId.get(current)
      const p = [
        Math.round(((e.clientX - box.left) / box.width) * s.image.width * 10) / 10,
        Math.round(((e.clientY - box.top) / box.height) * s.image.height * 10) / 10,
      ]
      if (p[0] < 0 || p[1] < 0 || p[0] > s.image.width || p[1] > s.image.height) return
      if (
        mode === 'entrance' &&
        records[current].entrances[activeEntrance]?.kind === 'arc' &&
        records[current].entrances[activeEntrance].points.length >= 3
      ) {
        $('#error').textContent = '这条圆弧已完成，可新增入口或清空重画。'
        return
      }
      change((r) => {
        if (mode === 'entrance') {
          if (!r.entrances[activeEntrance]) {
            activeEntrance = r.entrances.length
            r.entrances.push({ kind: $('#entrance-kind').value, points: [] })
          }
          r.entrances[activeEntrance].points.push(p)
        } else {
          if (mode === 'calibration' && r.calibration.length === 2) r.calibration = []
          r[mode].push(p)
        }
      })
    })
    document
      .querySelectorAll('[data-mode]')
      .forEach((b) => (b.onclick = () => setMode(b.dataset.mode)))
    $('#new-entrance').onclick = () =>
      change((r) => {
        activeEntrance = r.entrances.length
        r.entrances.push({ kind: $('#entrance-kind').value, points: [] })
      })
    $('#entrance-list').onchange = () => {
      activeEntrance = Number($('#entrance-list').value)
      draw()
    }
    $('#delete-entrance').onclick = () =>
      change((r) => {
        r.entrances.splice(activeEntrance, 1)
        activeEntrance = Math.max(0, activeEntrance - 1)
      })
    $('#undo').onclick = () => restore('undo')
    $('#redo').onclick = () => restore('redo')
    $('#clear').onclick = () => {
      if (mode !== 'view')
        change((r) => {
          if (mode === 'entrance') {
            if (r.entrances[activeEntrance]) r.entrances[activeEntrance].points = []
          } else r[mode] = []
        })
    }
    $('#cancel').onclick = () => {
      if (!current) return
      change(
        () => {
          records[current] = clone(openingRecord)
          activeEntrance = 0
        },
        { invalidate: false },
      )
      syncFields()
      closeEditor()
    }
    document.addEventListener('keydown', (e) => {
      if (
        !current ||
        !(e.ctrlKey || e.metaKey) ||
        e.altKey ||
        e.target?.closest?.('input,textarea,select,[contenteditable="true"]')
      )
        return
      const k = e.key.toLowerCase()
      if (k === 'z' || k === 'y') {
        e.preventDefault()
        restore(k === 'y' || e.shiftKey ? 'redo' : 'undo')
      }
    })
    for (const [id, field] of [
      ['length', 'lengthMm'],
      ['geometry', 'geometry'],
      ['page-type', 'pageType'],
      ['reviewer', 'reviewer'],
      ['notes', 'notes'],
      ['open-edge', 'openEdge'],
    ])
      $('#' + id).addEventListener('input', () => {
        if (!current) return
        const value =
          field === 'lengthMm'
            ? Number($('#' + id).value)
            : field === 'openEdge'
              ? $('#' + id).checked
              : $('#' + id).value
        change((r) => (r[field] = value))
        if (field === 'reviewer') {
          reviewerDefault = value
          try {
            localStorage.setItem('recognition-reviewer', value)
          } catch {}
        }
      })
    $('#approve').onclick = () => {
      const r = clone(records[current])
      r.reviewer = $('#reviewer').value.trim()
      const errors = validate(r, byId.get(current))
      $('#error').textContent = errors.join('\n')
      if (errors.length) return
      change(
        () => {
          r.status = 'reviewed'
          r.origin = 'manual'
          r.entranceReviewVersion = 2
          r.reviewedAt = new Date().toISOString()
          records[current] = r
        },
        { invalidate: false },
      )
      reviewerDefault = r.reviewer
      try {
        localStorage.setItem('recognition-reviewer', r.reviewer)
      } catch {}
      if (save()) closeEditor()
      else $('#error').textContent = '本机保存失败，请先导出审核包。'
    }
    $('#ambiguous').onclick = () => {
      change(
        (r) => {
          r.status = 'ambiguous'
          delete r.reviewedAt
        },
        { invalidate: false },
      )
      if (save()) closeEditor()
    }
    $('#draft').onclick = () => {
      if (save()) closeEditor()
    }
    $('#close').onclick = closeEditor
    $('#zoom-in').onclick = () => {
      zoom = Math.min(3600, zoom + 300)
      draw()
    }
    $('#zoom-out').onclick = () => {
      zoom = Math.max(300, zoom - 300)
      draw()
    }
    $('#cards').onclick = (e) => {
      const b = e.target.closest('[data-open]')
      if (b) open(b.dataset.open)
    }
    $('#filter').onchange = render
    $('#search').oninput = render
    function exportPack() {
      return {
        schemaVersion: 2,
        datasetId: dataset.id,
        fingerprint: dataset.fingerprint,
        reviewVersion: dataset.reviewVersion ?? null,
        acceptanceListSha256: dataset.acceptanceListSha256,
        annotationScope: ['边界', '比例', '多入口与开放侧', '形态标签'],
        fullStoreQualificationAvailable: false,
        annotations: dataset.samples.map((s) => {
          const r = records[s.id] || fresh(),
            errors = validate(r, s)
          return {
            store_id: s.id,
            sourceSha256: s.sourceSha256,
            image: s.image,
            page: s.page,
            ...clone(r),
            status: r.status === 'reviewed' && errors.length ? 'pending' : r.status,
            mmPerPixel: scaleOf(r),
            validationErrors: errors,
          }
        }),
      }
    }
    $('#export-all').onclick = () => {
      const url = URL.createObjectURL(
          new Blob([JSON.stringify(exportPack(), null, 2)], { type: 'application/json' }),
        ),
        a = document.createElement('a')
      a.href = url
      a.download = dataset.id + '-审核-v2.json'
      a.click()
      setTimeout(() => URL.revokeObjectURL(url), 1000)
    }
    $('#import-button').onclick = () => $('#import-file').click()
    $('#import-file').onchange = async (e) => {
      try {
        if (!e.target.files[0]) return
        const incoming = decodePack(JSON.parse(await e.target.files[0].text()))
        // 原子导入，写入当前记录前保留可恢复的全量备份；存储失败则不覆盖。
        localStorage.setItem(
          key + ':before-import',
          JSON.stringify({ datasetId: dataset.id, fingerprint: dataset.fingerprint, records }),
        )
        const merged = { ...records, ...incoming }
        localStorage.setItem(
          key,
          JSON.stringify({
            schemaVersion: 2,
            datasetId: dataset.id,
            fingerprint: dataset.fingerprint,
            records: merged,
          }),
        )
        records = merged
        histories.clear()
        render()
        $('#save-state').textContent = '审核包已导入'
      } catch (error) {
        $('#save-state').textContent = '未导入：' + error.message
      } finally {
        e.target.value = ''
      }
    }
    render()
    if (typeof location !== 'undefined') {
      const id = new URLSearchParams(location.search).get('store')
      if (byId.has(id)) open(id)
    }
  </script>
</html>
